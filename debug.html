<!doctype html>
<html lang="en" class="dark-mode">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Debug — Counters</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="theme-color" content="#0d0e11" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="./debug.css" />
  </head>

  <body class="debug-body">
    <div id="ambient-backdrop" class="ambient-backdrop" aria-hidden="true"></div>

    <!-- Populated dynamically from CVD_MATRICES in palettes.js -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs id="cvd-filter-defs"></defs>
    </svg>

    <div class="studio-shell">
      <header class="studio-topbar">
        <div class="topbar-brand">
          <a href="./" class="secondary-btn lab-back-btn" id="btn-back-counters">
            ← Counters
          </a>

          <div class="brand-heading">
            <h1 class="studio-title">Debug</h1>
          </div>
        </div>

        <div class="topbar-controls">
          <div class="control-cluster" role="group" aria-label="Color vision simulation">
            <span class="cluster-label">Vision</span>
            <div class="segmented-control" id="vision-mode-group">
              <button type="button" class="segment-btn active" data-vision="normal" aria-pressed="true">Normal</button>
              <button type="button" class="segment-btn" data-vision="deuteranopia" aria-pressed="false" title="Simulate deuteranopia">Deutan</button>
              <button type="button" class="segment-btn" data-vision="protanopia" aria-pressed="false" title="Simulate protanopia">Protan</button>
              <button type="button" class="segment-btn" data-vision="tritanopia" aria-pressed="false" title="Simulate tritanopia">Tritan</button>
            </div>
          </div>

          <div class="control-cluster" role="group" aria-label="Appearance">
            <div class="segmented-control" id="theme-mode-group">
              <button type="button" class="segment-btn active" data-theme-mode="dark" aria-pressed="true">Dark</button>
              <button type="button" class="segment-btn" data-theme-mode="light" aria-pressed="false">Light</button>
            </div>
          </div>

          <div class="control-cluster" role="group" aria-label="Sound">
            <span class="cluster-label">Sound</span>
            <div class="segmented-control" id="sound-mode-group">
              <button type="button" class="segment-btn active" data-sound-mode="on" aria-pressed="true">On</button>
              <button type="button" class="segment-btn" data-sound-mode="off" aria-pressed="false">Off</button>
            </div>
          </div>

          <button type="button" class="primary-btn lab-compact-btn" id="btn-copy-code">
            Copy code
          </button>
        </div>
      </header>

      <main class="studio-workspace">
        <!-- Left column: 24-palette catalog using Counters' .palette-picker-grid & .palette-option-card -->
        <aside class="catalog-column" aria-label="Palette catalog">
          <div class="settings-section catalog-panel">
            <div class="catalog-header">
              <div class="category-tabs" id="category-tabs" role="tablist" aria-label="Palette categories"></div>
            </div>

            <div
              class="palette-picker-grid palette-catalog-scroll"
              id="palette-catalog-grid"
              role="radiogroup"
              aria-label="Palettes"
            ></div>

            <div class="dynamic-dock" id="dynamic-dock">
              <div class="hue-row">
                <div class="hue-row-top">
                  <label for="studio-theme-hue" class="setting-title">
                    Theme color
                    <span class="dock-sub" id="theme-hue-readout">205°</span>
                  </label>
                  <span class="setting-desc" id="theme-hue-hint">Drives accents &amp; Tonal</span>
                </div>
                <input
                  type="range"
                  id="studio-theme-hue"
                  class="hue-slider"
                  min="0"
                  max="360"
                  value="205"
                  aria-label="Theme color hue"
                />
              </div>

              <div class="dynamic-extra" id="dynamic-extra" hidden></div>
            </div>
          </div>
        </aside>

        <!-- Center column: Real live Counters app in sandboxed ?lab=1 iframe -->
        <section class="simulator-column" aria-label="Live Counters app">
          <div class="settings-section sim-toolbar" role="toolbar" aria-label="Board preset controls">
            <div class="sim-tool-group" title="Card ordering on the board">
              <span class="sim-tool-label">Order</span>
              <div class="segmented-control lab-mini-seg" id="board-order-group">
                <button type="button" class="segment-btn active" data-order="rainbow" aria-pressed="true">Rainbow</button>
                <button type="button" class="segment-btn" data-order="slots" aria-pressed="false">Slots 0–7</button>
              </div>
            </div>

            <div class="sim-tool-group" title="Counter labels">
              <span class="sim-tool-label">Labels</span>
              <div class="segmented-control lab-mini-seg" id="board-label-group">
                <button type="button" class="segment-btn active" data-label-mode="birds" aria-pressed="true">Birds</button>
                <button type="button" class="segment-btn" data-label-mode="colors" aria-pressed="false">Names</button>
                <button type="button" class="segment-btn" data-label-mode="hex" aria-pressed="false">Hex</button>
              </div>
            </div>

            <div class="sim-tool-group" title="Counter values">
              <span class="sim-tool-label">Values</span>
              <div class="segmented-control lab-mini-seg" id="board-preset-group">
                <button type="button" class="segment-btn active" data-preset="demo" aria-pressed="true">Demo</button>
                <button type="button" class="segment-btn" data-preset="heat" aria-pressed="false">Heat 1–8</button>
                <button type="button" class="segment-btn" data-preset="scores" aria-pressed="false">Game</button>
              </div>
            </div>

            <div class="sim-tool-group" title="Grid or list layout">
              <div class="segmented-control lab-mini-seg" id="board-layout-group">
                <button type="button" class="segment-btn active" data-layout-mode="grid" aria-pressed="true">Grid</button>
                <button type="button" class="segment-btn" data-layout-mode="list" aria-pressed="false">List</button>
              </div>
            </div>
          </div>

          <div class="device-frame" id="counters-device">
            <iframe
              id="counters-iframe"
              class="counters-iframe"
              src="./?lab=1"
              title="Live Counters preview"
            ></iframe>
          </div>
        </section>

        <!-- Right column: 8-slot values, contrast audit & Picker instrument -->
        <section class="inspector-column" aria-label="Palette details">
          <div class="settings-section inspector-panel">
            <div class="inspector-header">
              <div class="inspector-title-row">
                <div class="inspector-title-wrap">
                  <h2 class="inspector-title" id="inspector-palette-name">Bold</h2>
                  <span class="debug-badge" id="inspector-group-badge">In Counters</span>
                </div>
                <div class="step-arrows">
                  <button type="button" class="secondary-btn step-arrow-btn" id="btn-prev-palette" aria-label="Previous palette" title="Previous palette ([)">‹</button>
                  <button type="button" class="secondary-btn step-arrow-btn" id="btn-next-palette" aria-label="Next palette" title="Next palette (])">›</button>
                </div>
              </div>
              <p class="setting-desc inspector-notes" id="inspector-palette-notes"></p>
            </div>

            <div class="audit-metrics">
              <div class="metric-tile">
                <span class="setting-desc">Card text</span>
                <span class="metric-value" id="metric-polarity">Uniform white</span>
              </div>
              <div class="metric-tile">
                <span class="setting-desc">Min contrast</span>
                <span class="metric-value" id="metric-contrast">4.63:1 AA</span>
              </div>
              <div class="metric-tile">
                <span class="setting-desc" id="metric-delta-label">Min OKLab ΔE</span>
                <span class="metric-value" id="metric-delta">10.0</span>
              </div>
            </div>

            <div class="instrument-strip" id="instrument-strip">
              <div class="instrument-info">
                <span class="instrument-title-row">
                  <span class="setting-title">Picker instrument</span>
                  <span class="debug-badge" id="instrument-name">Marimba</span>
                </span>
                <span class="instrument-recipe" id="instrument-recipe">sine + 4× triangle · 3200 Hz LP</span>
              </div>
              <div class="instrument-actions">
                <button type="button" class="dyn-chip" id="btn-audition-chime" title="Play settings preview chime">Chime</button>
                <button type="button" class="dyn-chip" id="btn-audition-chord" title="Play Picker chord resolution">Chord</button>
                <button type="button" class="dyn-chip" id="btn-audition-pop" title="Play defeated pointer pop">Pop</button>
                <button type="button" class="dyn-chip accent-chip" id="btn-demo-picker" title="Switch to Picker and drop 5 virtual fingers (or click spots directly on the Picker tab)">5 fingers</button>
              </div>
            </div>

            <div class="swatches-section">
              <div class="section-caption-row">
                <span class="setting-title">All 8 slot values</span>
                <span class="setting-desc">Click a swatch to copy hex</span>
              </div>
              <div class="swatch-values-grid" id="swatch-values-grid"></div>
            </div>

            <div class="migration-section">
              <div class="section-caption-row">
                <span class="setting-title">Slot mapping from Bold</span>
                <button type="button" class="text-link-btn" id="btn-toggle-code">Show code</button>
              </div>
              <div class="slot-migration-strip" id="slot-migration-strip" aria-label="Slot color mapping from Bold"></div>
            </div>

            <div class="code-drawer" id="code-drawer" hidden>
              <pre class="code-pre"><code id="code-snippet"></code></pre>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="studio-toast" class="studio-toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="./debug.js"></script>
  </body>
</html>
