<!doctype html>
<html lang="en" class="dark-mode">
  <head>
    <script>window.__APP_VERSION__ = "0.3.3";
window.__COMMIT_HASH__ = "4fb9fb8";
window.__IS_DIRTY__ = false;</script>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Palettes — Counters</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="theme-color" content="#0d0e11" />
    <script type="module" crossorigin src="./assets/palettes-lab-DMCMZMhV.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/palettes-DcVaoEcq.js">
    <link rel="stylesheet" crossorigin href="./assets/palettes-lab-D804EV1Q.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>

  <body>
    <!-- Hardware-accelerated linear-RGB Machado (2009) CVD filters for the live Counters iframe -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter id="cvd-deuteranopia" color-interpolation-filters="linearRGB">
          <feColorMatrix
            type="matrix"
            values="0.367322 0.860646 -0.227968 0 0  0.280085 0.672501 0.047413 0 0  -0.01182 0.04294 0.968881 0 0  0 0 0 1 0"
          />
        </filter>
        <filter id="cvd-protanopia" color-interpolation-filters="linearRGB">
          <feColorMatrix
            type="matrix"
            values="0.152286 1.052583 -0.204868 0 0  0.114503 0.786281 0.099216 0 0  -0.003882 -0.048116 1.051998 0 0  0 0 0 1 0"
          />
        </filter>
        <filter id="cvd-tritanopia" color-interpolation-filters="linearRGB">
          <feColorMatrix
            type="matrix"
            values="1.255528 -0.076749 -0.178779 0 0  -0.078411 0.930809 0.147602 0 0  0.004733 0.691367 0.3039 0 0  0 0 0 1 0"
          />
        </filter>
      </defs>
    </svg>

    <div class="studio-shell">
      <header class="studio-topbar">
        <div class="topbar-brand">
          <a href="./" class="back-pill" id="btn-back-counters">
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Counters</span>
          </a>

          <div class="brand-heading">
            <h1 class="studio-title">Palettes</h1>
            <span class="debug-badge">Debug lab</span>
          </div>
        </div>

        <div class="topbar-controls">
          <div class="control-cluster" role="group" aria-label="Color vision simulation">
            <span class="cluster-label">Vision</span>
            <div class="seg-group" id="vision-mode-group">
              <button type="button" class="seg-btn active" data-vision="normal" aria-pressed="true">Normal</button>
              <button type="button" class="seg-btn" data-vision="deuteranopia" aria-pressed="false" title="Simulate deuteranopia">Deutan</button>
              <button type="button" class="seg-btn" data-vision="protanopia" aria-pressed="false" title="Simulate protanopia">Protan</button>
              <button type="button" class="seg-btn" data-vision="tritanopia" aria-pressed="false" title="Simulate tritanopia">Tritan</button>
            </div>
          </div>

          <div class="control-cluster" role="group" aria-label="Appearance">
            <div class="seg-group" id="theme-mode-group">
              <button type="button" class="seg-btn active" data-theme-mode="dark" aria-pressed="true">Dark</button>
              <button type="button" class="seg-btn" data-theme-mode="light" aria-pressed="false">Light</button>
            </div>
          </div>

          <button
            type="button"
            class="action-pill-btn"
            id="btn-sound-toggle"
            aria-pressed="true"
            title="Toggle Picker instrument audio"
          >
            <span id="sound-toggle-label">Sound on</span>
          </button>

          <button type="button" class="action-pill-btn primary" id="btn-copy-code">
            <span>Copy code</span>
          </button>
        </div>
      </header>

      <main class="studio-workspace">
        <!-- Left column: 24-palette catalog + dynamic controls -->
        <aside class="catalog-column" aria-label="Palette catalog">
          <div class="panel-card catalog-panel">
            <div class="catalog-header">
              <div class="category-tabs" id="category-tabs" role="tablist" aria-label="Palette categories"></div>
            </div>

            <div
              class="palette-catalog-scroll"
              id="palette-catalog-grid"
              role="radiogroup"
              aria-label="Palettes"
            ></div>

            <div class="dynamic-dock" id="dynamic-dock">
              <div class="hue-row">
                <div class="hue-row-top">
                  <label for="studio-theme-hue" class="dock-label">
                    Theme color
                    <span class="dock-sub" id="theme-hue-readout">205°</span>
                  </label>
                  <span class="dock-hint" id="theme-hue-hint">Drives accents &amp; Tonal</span>
                </div>
                <input
                  type="range"
                  id="studio-theme-hue"
                  class="hue-slider"
                  min="0"
                  max="360"
                  value="205"
                  aria-label="Theme color hue"
                />
              </div>

              <div class="dynamic-extra" id="dynamic-extra" hidden></div>
            </div>
          </div>
        </aside>

        <!-- Center column: Real live Counters app in sandboxed ?lab=1 iframe -->
        <section class="simulator-column" aria-label="Live Counters app">
          <div class="sim-toolbar" role="toolbar" aria-label="Board preset controls">
            <div class="sim-tool-group" title="Card ordering on the board">
              <span class="sim-tool-label">Order</span>
              <div class="mini-seg" id="board-order-group">
                <button type="button" class="mini-seg-btn active" data-order="rainbow" aria-pressed="true">Rainbow</button>
                <button type="button" class="mini-seg-btn" data-order="slots" aria-pressed="false">Slots 0–7</button>
              </div>
            </div>

            <div class="sim-tool-group" title="Counter labels">
              <span class="sim-tool-label">Labels</span>
              <div class="mini-seg" id="board-label-group">
                <button type="button" class="mini-seg-btn active" data-label-mode="birds" aria-pressed="true">Birds</button>
                <button type="button" class="mini-seg-btn" data-label-mode="colors" aria-pressed="false">Names</button>
                <button type="button" class="mini-seg-btn" data-label-mode="hex" aria-pressed="false">Hex</button>
              </div>
            </div>

            <div class="sim-tool-group" title="Counter values">
              <span class="sim-tool-label">Values</span>
              <div class="mini-seg" id="board-preset-group">
                <button type="button" class="mini-seg-btn active" data-preset="demo" aria-pressed="true">Demo</button>
                <button type="button" class="mini-seg-btn" data-preset="heat" aria-pressed="false">Heat 1–8</button>
                <button type="button" class="mini-seg-btn" data-preset="scores" aria-pressed="false">Game</button>
              </div>
            </div>

            <div class="sim-tool-group" title="Grid or list layout">
              <div class="mini-seg" id="board-layout-group">
                <button type="button" class="mini-seg-btn active" data-layout-mode="grid" aria-pressed="true">Grid</button>
                <button type="button" class="mini-seg-btn" data-layout-mode="list" aria-pressed="false">List</button>
              </div>
            </div>
          </div>

          <div class="device-frame" id="counters-device">
            <iframe
              id="counters-iframe"
              class="counters-iframe"
              src="./?lab=1"
              title="Live Counters preview"
            ></iframe>
          </div>
        </section>

        <!-- Right column: 8-slot values, contrast audit & Picker instrument -->
        <section class="inspector-column" aria-label="Palette details">
          <div class="panel-card inspector-panel">
            <div class="inspector-header">
              <div class="inspector-title-row">
                <div class="inspector-title-wrap">
                  <h2 class="inspector-title" id="inspector-palette-name">Bold</h2>
                  <span class="group-badge" id="inspector-group-badge">In Counters</span>
                </div>
                <div class="step-arrows">
                  <button type="button" class="step-arrow-btn" id="btn-prev-palette" aria-label="Previous palette" title="Previous palette ([)">
                    <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                  </button>
                  <button type="button" class="step-arrow-btn" id="btn-next-palette" aria-label="Next palette" title="Next palette (])">
                    <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                  </button>
                </div>
              </div>
              <p class="inspector-notes" id="inspector-palette-notes"></p>
            </div>

            <div class="audit-metrics">
              <div class="metric-tile">
                <span class="metric-label">Card text</span>
                <span class="metric-value" id="metric-polarity">Uniform white</span>
              </div>
              <div class="metric-tile">
                <span class="metric-label">Min contrast</span>
                <span class="metric-value" id="metric-contrast">4.63:1 AA</span>
              </div>
              <div class="metric-tile">
                <span class="metric-label" id="metric-delta-label">Min OKLab ΔE</span>
                <span class="metric-value" id="metric-delta">10.0</span>
              </div>
            </div>

            <div class="instrument-strip" id="instrument-strip">
              <div class="instrument-info">
                <span class="instrument-title-row">
                  <span class="section-caption">Picker instrument</span>
                  <span class="instrument-badge" id="instrument-name">Marimba</span>
                </span>
                <span class="instrument-recipe" id="instrument-recipe">sine + 4× triangle · 3200 Hz LP</span>
              </div>
              <div class="instrument-actions">
                <button type="button" class="dyn-chip" id="btn-audition-chime" title="Play settings preview chime">Chime</button>
                <button type="button" class="dyn-chip" id="btn-audition-chord" title="Play Picker chord resolution">Chord</button>
                <button type="button" class="dyn-chip" id="btn-audition-pop" title="Play defeated pointer pop">Pop</button>
              </div>
            </div>

            <div class="swatches-section">
              <div class="section-caption-row">
                <span class="section-caption">All 8 slot values</span>
                <span class="section-hint">Click a swatch to copy hex</span>
              </div>
              <div class="swatch-values-grid" id="swatch-values-grid"></div>
            </div>

            <div class="migration-section">
              <div class="section-caption-row">
                <span class="section-caption">Slot mapping from Bold</span>
                <button type="button" class="text-link-btn" id="btn-toggle-code">Show code</button>
              </div>
              <div class="slot-migration-strip" id="slot-migration-strip" aria-label="Slot color mapping from Bold"></div>
            </div>

            <div class="code-drawer" id="code-drawer" hidden>
              <pre class="code-pre"><code id="code-snippet"></code></pre>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="studio-toast" class="studio-toast" role="status" aria-live="polite" hidden></div>

  </body>
</html>
